name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Locale files are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json')); JSON.parse(require('fs').readFileSync('locale/en.json'))"
      - name: package.json is valid and files exist
        run: |
          node -e "const p=require('./package.json');const fs=require('fs');p.files.forEach(f=>{if(!f.includes('*')&&!fs.existsSync(f))throw new Error('missing '+f)});console.log('package ok',p.name,p.version)"
      - name: Media invariants (engineering-lessons guard)
        run: node scripts/guard.mjs --root . --rules scripts/guard.rules.json
